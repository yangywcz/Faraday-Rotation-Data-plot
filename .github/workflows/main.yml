name: Build and Release Windows executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-10-11-x64
            runner: windows-2022
            executable: Faraday-Rotation-Data-plot.exe
            shell: pwsh
          - target: macos-intel
            runner: macos-15-intel
            executable: Faraday-Rotation-Data-plot
            shell: bash
          - target: macos-arm64
            runner: macos-latest
            executable: Faraday-Rotation-Data-plot
            shell: bash
          - target: ubuntu-22.04-x64
            runner: ubuntu-22.04
            executable: Faraday-Rotation-Data-plot
            shell: bash
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validate and write version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must follow semantic versioning, for example 0.2.0" >&2
            exit 1
          fi
          version="${RELEASE_VERSION#v}"
          VERSION="$version" python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"',
              f'version = "{os.environ["VERSION"]}"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find project version in pyproject.toml")
          path.write_text(updated, encoding="utf-8")
          PY
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka ordered-set zstandard
          python -m pip install .

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m nuitka `
            --onefile `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --windows-console-mode=disable `
            --windows-icon-from-ico=logo.ico `
            --include-package=faraday_rotation_data_plot `
            --include-data-dir=assets=assets `
            --include-data-files=logo.ico=logo.ico `
            --include-data-files=SplashScreen.png=SplashScreen.png `
            --output-dir=dist `
            --output-filename=${{ matrix.executable }} `
            fr_gui_tk.py

      - name: Build Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=faraday_rotation_data_plot \
            --include-data-dir=assets=assets \
            --include-data-files=logo.ico=logo.ico \
            --include-data-files=SplashScreen.png=SplashScreen.png \
            --output-dir=dist \
            --output-filename="${{ matrix.executable }}" \
            fr_gui_tk.py

      - name: Upload platform executable
        uses: actions/upload-artifact@v4
        with:
          name: faraday-${{ matrix.target }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error

  build-win7:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86
            target: win7-x86
            executable: Faraday-Rotation-Data-plot-Win7-x86.exe
          - architecture: x64
            target: win7-x64
            executable: Faraday-Rotation-Data-plot-Win7-x64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: ${{ matrix.architecture }}

      - name: Install Win7-compatible dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -r requirements-win7.txt
          if ("${{ matrix.architecture }}" -eq "x64") {
            python -m pip install scipy==1.9.3
          }

      - name: Build native Tk executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "Faraday-Rotation-Data-plot-${{ matrix.target }}" `
            --icon logo.ico `
            --collect-all matplotlib `
            --collect-all openpyxl `
            --collect-all python_calamine `
            --collect-all ttkbootstrap `
            --add-data "logo.ico;." `
            --add-data "assets/fonts/HONORSansCN-Regular.ttf;assets/fonts" `
            --add-data "assets/fonts/HONORSansCN-Bold.ttf;assets/fonts" `
            fr_gui_win7.py

      - name: Upload Win7 executable
        uses: actions/upload-artifact@v4
        with:
          name: faraday-${{ matrix.target }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error

  release:
    needs: [build, build-win7]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform executables
        uses: actions/download-artifact@v4
        with:
          pattern: faraday-*
          path: release-assets
          merge-multiple: false

      - name: Rename platform assets
        shell: bash
        run: |
          mkdir -p release
          for directory in release-assets/faraday-*; do
            target="${directory##*/faraday-}"
            for executable in "$directory"/*; do
              cp "$executable" "release/faraday-$target-$(basename "$executable")"
            done
          done

      - name: Create GitHub release and upload executables
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Faraday Rotation Data Plot ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: release/*